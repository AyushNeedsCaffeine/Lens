<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lens{% endblock %}</title>
  <meta name="description" content="Lens turns recordings into transcripts, summaries, decisions, action items, and answers. Watch less. Understand more.">
  <meta name="theme-color" content="#FBF1E3">
  <link rel="icon" type="image/png" href="/static/img/lens-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css?v=4">
  {% block head %}{% endblock %}
</head>
<body class="site-body">
  <a class="skip-link mono" href="#main">SKIP TO CONTENT</a>

  <header class="site-header">
    <div class="nav-shell">
      <form action="/session/reset" method="post" class="brand-form" onsubmit="return confirm('Start a new session? You will return to the home screen.');">
        <button type="submit" class="brand" title="Start a new session" aria-label="Lens — start a new session">
          <img src="/static/img/lens-mark.png" alt="" class="brand-mark">
          <span class="brand-word">LENS</span>
        </button>
      </form>

      <div class="header-actions">
        {% block header_actions %}{% endblock %}
      </div>
    </div>
  </header>

  <main id="main" class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="/static/img/lens-mark.png" alt="" class="footer-mark">
        <span class="mono">WATCH LESS. UNDERSTAND MORE.</span>
      </div>
      <a class="mono footer-link" href="https://github.com/AyushNeedsCaffeine/Lens" target="_blank" rel="noreferrer">GITHUB ↗</a>
      <p class="mono footer-version">LENS · V2.0.3 · FASTAPI · MISTRAL · SARVAM · WHISPER</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
