services:
  - type: web
    name: lens
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: TRANSCRIPTION_BACKEND
        value: sarvam
      - key: EMBEDDING_BACKEND
        value: mistral
      - key: SARVAM_STT_MODEL
        value: saaras:v4
      - key: MISTRAL_MODEL
        value: ministral-8b-latest
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DAILY_JOB_LIMIT_PER_IP
        value: "3"
      - key: DAILY_JOB_LIMIT_GLOBAL
        value: "25"
      - key: DAILY_CHAT_LIMIT_PER_IP
        value: "40"
      - key: DAILY_CHAT_LIMIT_GLOBAL
        value: "400"
      - key: MISTRAL_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
